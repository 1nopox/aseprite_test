name: build-aseprite-steamos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git curl unzip cmake ninja clang gcc \
            libx11 libxcursor libxi libxrandr mesa-libgl fontconfig libwebp

      - name: Download Skia
        shell: bash
        run: |
          mkdir -p .deps/skia-m124
          skia_url=$(bash laf/misc/skia-url.sh Release | xargs)
          skia_file=$(basename "$skia_url")
          curl -L -o ".deps/skia-m124/$skia_file" "$skia_url"
          unzip -o ".deps/skia-m124/$skia_file" -d ".deps/skia-m124"

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$PWD/.deps/skia-m124" \
            -DSKIA_LIBRARY_DIR="$PWD/.deps/skia-m124/out/Release-x64" \
            -DENABLE_TESTS=OFF \
            -DENABLE_CCACHE=OFF

      - name: Build
        shell: bash
        run: |
          cmake --build build --target aseprite --parallel

      - name: Package portable build
        shell: bash
        run: |
          mkdir -p dist/root
          cp -a build/bin dist/root/
          if [ -d build/data ]; then
            cp -a build/data dist/root/
          fi
          tar -C dist/root -czf dist/aseprite-steamos.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-steamos
          path: dist/aseprite-steamos.tar.gz
          if-no-files-found: error
          retention-days: 14
