name: Build Aseprite on Arch Linux (SteamOS compatible)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Install Arch dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            git clang cmake ninja \
            libx11 libxcursor libxi libxrandr \
            mesa-libgl fontconfig libwebp \
            curl unzip

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Skia m124 (Linux x64)
        run: |
          mkdir -p /deps/skia
          curl -L -o /deps/skia.zip \
            https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip
          unzip -q /deps/skia.zip -d /deps/skia

      - name: Build
        run: |
          export CC=clang
          export CXX=clang++
          mkdir build && cd build
          cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS:STRING=-stdlib=libstdc++ \
            -DCMAKE_EXE_LINKER_FLAGS:STRING=-stdlib=libstdc++ \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=/deps/skia \
            -DSKIA_LIBRARY_DIR=/deps/skia/out/Release-x64 \
            -DSKIA_LIBRARY=/deps/skia/out/Release-x64/libskia.a \
            -G Ninja \
            ..
          ninja aseprite

      - name: Package
        run: |
          mkdir -p aseprite-steamos
          cp -r build/bin aseprite-steamos/
          cp -r data aseprite-steamos/
          strip aseprite-steamos/bin/aseprite
          tar czf aseprite-steamos.tar.gz aseprite-steamos

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-steamos-arch
          path: aseprite-steamos.tar.gz
