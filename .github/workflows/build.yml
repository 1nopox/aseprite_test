name: Build Aseprite for Linux

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang cmake ninja-build \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libfontconfig1-dev curl unzip

      - name: Download pre-built Skia m124
        run: |
          mkdir -p skia
          curl -L -o skia.zip \
            https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip
          unzip -q skia.zip -d skia

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS:STRING=-stdlib=libstdc++ \
            -DCMAKE_EXE_LINKER_FLAGS:STRING=-stdlib=libstdc++ \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=$(realpath skia) \
            -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-x64) \
            -DSKIA_LIBRARY=$(realpath skia/out/Release-x64/libskia.a)

      - name: Build
        run: |
          cmake --build build --target aseprite --parallel

      - name: Package
        run: |
          mkdir -p aseprite-linux
          cp -r build/bin aseprite-linux/
          cp -r data aseprite-linux/
          strip aseprite-linux/bin/aseprite
          tar czf aseprite-linux.tar.gz aseprite-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-linux-${{ github.sha }}
          path: aseprite-linux.tar.gz
          retention-days: 30
